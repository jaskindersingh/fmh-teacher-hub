<title>FMH Teacher Hub STAGING</title>
<script>
/* FMH Teacher Hub - teacher page hosted outside Google (Oct 14, 2026).
   This replaces only the connection layer of the existing Hub page.
   Requests go to the Hub backend WITHOUT Google cookies (credentials: 'omit'),
   so it works whatever Google accounts are signed in to this browser.
   Sign-in is the FMH email + 6-digit code; the signed session is then kept in
   this browser for 30 days (trusted device) until Sign out. Every permission is
   decided on the server; nothing here is trusted for identity or grade access. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzyzWipnFKmru6ueyQPb5fTC5gTIgOMmfaD88QA_dCrLYKuQ0tYaP8At64kiAX8iMXL/exec';
  // The Hub operations this page uses. The server has its own hardcoded allow-list.
  var OPS = ['apiStart', 'apiRequestCode', 'apiVerifyCode', 'apiGrade', 'apiStudent',
             'apiAssign', 'apiCancel', 'apiReviewOptions', 'apiReview', 'apiSolution', 'apiSignOut'];
  function send(op, args, ok, bad) {
    fetch(API, {
      method: 'POST',
      credentials: 'omit',
      cache: 'no-store',
      redirect: 'follow',
      referrerPolicy: 'no-referrer',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: op, args: args })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (v) { if (ok) ok(v); }, function (err) { if (bad) bad(err); });
  }
  // Same calling style as google.script.run, so the Hub page code is unchanged.
  function runner(ok, bad) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, bad); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    OPS.forEach(function (op) {
      r[op] = function () { send(op, Array.prototype.slice.call(arguments), ok, bad); };
    });
    return r;
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>

<style>

@media(prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2129;--ink:#e8ecf3;--muted:#97a3b6;--line:#2c323d;--soft:#232833;--ambg:#33261a;--amber:#e0a761}}

button,select,input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 120px}
header{display:flex;align-items:center;gap:10px;padding:16px 2px 10px;flex-wrap:wrap}
.brand{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.title{font-size:22px;font-weight:750;line-height:1.15}
.who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere;max-width:60%}
.who a{display:inline-block;min-height:44px;line-height:44px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:650;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}

.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{display:flex;gap:0;margin:14px 0 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}

.item:first-child{border-top:0}

.item .main{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:650}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}

.over{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;padding:24px 10px}
.sheet{background:var(--card);border-radius:16px;max-width:760px;width:100%;padding:18px;margin-bottom:40px}

th.q,td.q{min-width:26px;padding:8px 2px}
td.x{color:#fff;background:#d9534f;font-weight:800}
td.ok{color:var(--green);font-weight:800}
.ready{font-size:17px;font-weight:650}
.center{text-align:center;padding:50px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#182230;color:#fff;padding:12px 18px;border-radius:12px;z-index:40;max-width:90%;font-size:15px}
.pages img{width:100%;display:block;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.hidden{display:none!important}
.signin{max-width:460px;margin:24px auto;padding:24px 20px}
.signin h1{font-size:22px;margin:0 0 6px}
.signin p{margin:8px 0;color:var(--muted)}
.signin label{display:block;font-weight:650;margin:16px 0 6px}
.signin input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font-size:18px}
.signin input.code{font-size:28px;letter-spacing:.4em;text-align:center;font-variant-numeric:tabular-nums}
.signin .btn{width:100%;margin-top:14px;min-height:52px;font-size:17px}
.signin .links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.signin .links button{background:none;border:0;color:var(--blue);font-weight:650;min-height:44px;padding:0 4px;cursor:pointer}
.signin .links button[disabled]{color:var(--muted);cursor:default}
.signin .em{font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.who .out{background:none;border:0;color:var(--blue);font-weight:650;min-height:44px;padding:0 4px;cursor:pointer}
</style>

<div class="wrap">
  <header>
    <div><div class="brand">Fremont Math Hub</div><div class="title">Teacher Hub</div></div>
    <div class="who" id="who"></div>
  </header>
  <div id="screen"></div>
</div>
<div id="barHost"></div>
<div id="overHost"></div>

<script>
var BOOT = {"codeMinutes":10};
var S = { session: null, me: null, grade: '', gd: null, cls: '', q: '', tq: '', pick: {}, tpick: {}, tab: 'assign', rv: null };

/* ---------- tiny DOM helpers (no innerHTML with data) ---------- */
function h(tag, attrs) {
  var el = document.createElement(tag), i;
  attrs = attrs || {};
  for (var k in attrs) {
    if (k === 'text') el.textContent = attrs[k];
    else if (k === 'cls') el.className = attrs[k];
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  }
  for (i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el) {
  for (var i = 1; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); continue; }
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
}
function $(id) { return document.getElementById(id); }
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function toast(t) {
  var el = h('div', { cls: 'toast', text: t }); document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 4200);
}

/* ---------- server calls ---------- */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve) {
    var r = google.script.run.withSuccessHandler(function (res) {
      if (res && res.auth) { signedOut(res.msg); return; }
      resolve(res || { ok: false, msg: 'No answer from the server.' });
    }).withFailureHandler(function (err) {
      resolve({ ok: false, msg: 'Could not reach the server. Check the internet connection and try again.' });
    });
    r[fn].apply(r, args);
  });
}
/* The session is kept in this browser for 30 days (trusted device) until Sign out. The server re-checks it on every request. */
function store(v) {
  try { if (v) localStorage.setItem('fmhTH', v); else localStorage.removeItem('fmhTH'); } catch (e) {}
  try { sessionStorage.removeItem('fmhTH'); } catch (e) {}
}
function stored() {
  var v = null;
  try { v = localStorage.getItem('fmhTH'); } catch (e) {}
  if (!v) try { v = sessionStorage.getItem('fmhTH'); } catch (e) {}   // sessions from before Oct 14
  return v;
}
/* A sign-in in progress (email + request id, never the code) is remembered in this tab for 15 minutes, so switching
   to the mail app, reloading, or asking again keeps the same request and the code already emailed keeps working. */
function pendSet(email, rid) { try { if (email) sessionStorage.setItem('fmhTHp', JSON.stringify({ e: email, r: rid, t: Date.now() })); else sessionStorage.removeItem('fmhTHp'); } catch (e) {} }
function pendGet(email) {
  try {
    var p = JSON.parse(sessionStorage.getItem('fmhTHp') || 'null');
    if (p && p.e && /^[0-9a-f]{32}$/.test(p.r) && Date.now() - p.t < 15 * 60000 && (!email || p.e.toLowerCase() === String(email).trim().toLowerCase())) return p;
  } catch (e) {}
  return null;
}

/* ---------- start ---------- */
function boot() {
  var s = stored();
  if (!s) { var p = pendGet(''); if (p) codeStep(p.e, p.r, 'Type the 6-digit code from your email.'); else emailStep(''); return; }
  loading('Signing you in…');
  call('apiStart', null, s).then(function (r) { r.ok ? started(r) : signedOut(r.msg); });
}
function started(r) {
  S.session = r.session; S.me = r.me; store(r.session); pendSet(null);
  clear($('who')); add($('who'), [h('div', { text: 'Signed in as' }), h('div', { cls: 'nm', text: S.me.email }),
    h('button', { cls: 'out', text: 'Sign out', onclick: function () { var s = S.session; pendSet(null); if (s) call('apiSignOut', s); signedOut('You are signed out on this device.'); } })]);
  var codes = S.me.grades.map(function (g) { return g.code; });
  if (codes.indexOf(S.grade) < 0) S.grade = codes.length === 1 ? codes[0] : '';
  render();
  if (S.grade) openGrade(S.grade);
}
function signedOut(msg) {
  S.grade = ''; S.gd = null; S.rv = null; S.pick = {}; S.tpick = {};
  emailStep('', msg);
}
function resetShell() {
  store(null); S.session = null; S.me = null; clear($('who')); clear($('barHost')); clear($('overHost'));
  return clear($('screen'));
}

/* ---------- sign-in with an emailed code (works with any number of Google accounts on the device) ---------- */
function emailStep(email, msg) {
  var scr = resetShell();
  var inp = h('input', { type: 'email', id: 'em', autocomplete: 'email', inputmode: 'email', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', placeholder: 'name@gmail.com', value: email || '' });
  var note = h('div', { cls: msg ? 'msg' : 'hidden', text: msg || '' });
  var go = h('button', { cls: 'btn primary', type: 'submit', text: 'Email me a code' });
  var form = h('form', { onsubmit: function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { note.className = 'msg bad'; note.textContent = 'Please type your full FMH email address.'; return; }
      go.disabled = true; go.textContent = 'Sending…';
      var p = pendGet(v);
      call('apiRequestCode', v, p ? p.r : '').then(function (r) {
        if (r.ok) { codeStep(v, r.rid, r.msg); return; }
        go.disabled = false; go.textContent = 'Email me a code'; note.className = 'msg bad'; note.textContent = r.msg || 'Please try again.';
      });
    } },
    h('h1', { text: 'Teacher sign-in' }),
    h('p', { text: 'Type your FMH teacher email. We will email you a 6-digit code.' }),
    h('label', { 'for': 'em', text: 'FMH teacher email' }), inp, note, go,
    h('p', { cls: 'sub', text: 'Other Google accounts signed in on this device do not matter.' }));
  add(scr, h('div', { cls: 'card signin' }, form));
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
}
function codeStep(email, rid, msg) {
  var scr = resetShell();
  var inp = h('input', { cls: 'code', id: 'cd', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', maxlength: '6', autocomplete: 'one-time-code', placeholder: '••••••', 'aria-label': '6-digit code' });
  var note = h('div', { cls: 'msg', text: msg || '' });
  var go = h('button', { cls: 'btn primary', type: 'submit', text: 'Sign in' });
  var again = h('button', { type: 'button', text: 'Send a new code', onclick: function () {
      again.disabled = true;
      call('apiRequestCode', email, rid).then(function (r) { if (r.ok && r.rid) { rid = r.rid; pendSet(email, rid); } note.className = r.ok ? 'msg' : 'msg bad'; note.textContent = r.msg || ''; wait(); });
    } });
  var other = h('button', { type: 'button', text: 'Use a different email', onclick: function () { pendSet(null); emailStep(''); } });
  pendSet(email, rid);
  function wait() {
    var n = 30; again.disabled = true; again.textContent = 'Send a new code (' + n + ')';
    var t = setInterval(function () { n--; if (n <= 0 || !document.body.contains(again)) { clearInterval(t); again.disabled = false; again.textContent = 'Send a new code'; } else again.textContent = 'Send a new code (' + n + ')'; }, 1000);
  }
  inp.addEventListener('input', function () { var d = inp.value.replace(/\D/g, '').slice(0, 6); if (d !== inp.value) inp.value = d; });
  var form = h('form', { onsubmit: function (e) {
      e.preventDefault();
      var c = inp.value.replace(/\D/g, '');
      if (c.length !== 6) { note.className = 'msg bad'; note.textContent = 'The code has 6 digits.'; return; }
      go.disabled = true; go.textContent = 'Checking…';
      call('apiVerifyCode', email, rid, c).then(function (r) {
        if (r.ok) { started(r); return; }
        go.disabled = false; go.textContent = 'Sign in'; inp.value = ''; note.className = 'msg bad'; note.textContent = r.msg || 'Please try again.';
        try { inp.focus(); } catch (e) {}
      });
    } },
    h('h1', { text: 'Enter your code' }),
    h('p', null, 'Signing in as ', h('span', { cls: 'em', text: email })),
    h('label', { 'for': 'cd', text: '6-digit code from the email' }), inp, note, go,
    h('div', { cls: 'links' }, again, other),
    h('p', { cls: 'sub', text: 'The code works once, only in this browser, for ' + (BOOT.codeMinutes || 10) + ' minutes. Asking again re-sends the same code. Check Spam if it does not arrive.' }),
    h('p', { cls: 'sub', text: 'After you sign in, this browser stays signed in for 30 days. On a shared computer, tap Sign out when you finish.' }));
  add(scr, h('div', { cls: 'card signin' }, form));
  wait();
  setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
}
function loading(t) { clear($('barHost')); add(clear($('screen')), h('div', { cls: 'card center sub', text: t })); }

/* ---------- main screen ---------- */
function render() {
  var scr = clear($('screen'));
  add(scr, h('h2', { text: 'Your grades' }));
  add(scr, h('div', { cls: 'chips' }, S.me.grades.map(function (g) {
    return h('button', { cls: 'chip' + (g.code === S.grade ? ' on' : ''), text: g.code, title: g.label,
      onclick: function () { if (S.grade !== g.code) { S.grade = g.code; S.pick = {}; S.tpick = {}; S.cls = ''; S.q = ''; S.tq = ''; S.rv = null; openGrade(g.code); } } });
  })));
  if (!S.grade) { add(scr, h('div', { cls: 'card sub', text: 'Choose a grade to begin.' })); clear($('barHost')); return; }
  add(scr, h('div', { cls: 'tabs' },
    h('button', { cls: 'tab' + (S.tab === 'assign' ? ' on' : ''), text: 'Assign homework', onclick: function () { S.tab = 'assign'; render(); } }),
    h('button', { cls: 'tab' + (S.tab === 'review' ? ' on' : ''), text: 'Ask or Explain', onclick: function () { S.tab = 'review'; render(); if (!S.rv) loadReview(); } })));
  var pane = h('div', { id: 'pane' }); add(scr, pane);
  if (S.tab === 'assign') renderAssign(pane); else renderReview(pane);
}

function openGrade(g) {
  render(); add($('pane') || $('screen'), h('div', { cls: 'card center sub', text: 'Loading ' + g + '…' }));
  call('apiGrade', S.session, g).then(function (r) {
    if (S.grade !== g) return;
    if (!r.ok) { gradeProblem(r); return; }
    S.gd = r; render(); if (S.tab === 'review') loadReview();
  });
}
function gradeProblem(r) {
  toast(r.msg || 'Something went wrong.');
  if (r.grade) { S.grade = ''; S.gd = null; call('apiStart', null, S.session).then(function (x) { if (x.ok) started(x); }); }
}

/* ---------- Assign ---------- */
function shownStudents() {
  var q = S.q.trim().toLowerCase();
  return S.gd.students.filter(function (s) {
    return (!S.cls || s.cls === S.cls) && (!q || s.name.toLowerCase().indexOf(q) >= 0);
  });
}
function picked() { return S.gd.students.filter(function (s) { return S.pick[s.name]; }); }
function tpicked() { return S.gd.tests.filter(function (t) { return S.tpick[t.num]; }); }

function renderAssign(pane) {
  if (!S.gd || S.gd.grade !== S.grade) return;
  var gd = S.gd;
  add(pane, h('h2', { text: '1 · Students — ' + gd.label }));
  var clsSel = h('select', { 'aria-label': 'Class', onchange: function () { S.cls = this.value; drawStudents(); } },
    h('option', { value: '', text: 'All classes' }), gd.classes.map(function (c) { return h('option', { value: c, text: c, selected: c === S.cls }); }));
  var q = h('input', { type: 'search', placeholder: 'Search student name', value: S.q, oninput: function () { S.q = this.value; drawStudents(); } });
  add(pane, h('div', { cls: 'row' }, h('div', { cls: 'grow' }, clsSel), h('div', { cls: 'grow' }, q),
    h('button', { cls: 'btn small', text: 'Select all shown', onclick: function () { shownStudents().forEach(function (s) { if (!s.dup) S.pick[s.name] = true; }); drawStudents(); drawTests(); drawBar(); } }),
    h('button', { cls: 'btn small', text: 'Clear', onclick: function () { S.pick = {}; drawStudents(); drawTests(); drawBar(); } })));
  add(pane, h('div', { cls: 'list scroll', id: 'slist' }));
  add(pane, h('h2', { text: '2 · Homework' }));
  add(pane, h('input', { type: 'search', placeholder: 'Search homework number or topic', value: S.tq, oninput: function () { S.tq = this.value; drawTests(); } }));
  add(pane, h('div', { cls: 'list scroll', id: 'tlist', style: 'margin-top:8px' }));
  drawStudents(); drawTests(); drawBar();
}

function drawStudents() {
  var el = $('slist'); if (!el) return; clear(el);
  var list = shownStudents();
  if (!S.gd.students.length) { add(el, h('div', { cls: 'item sub', text: 'No active students in this grade.' })); return; }
  if (!list.length) { add(el, h('div', { cls: 'item sub', text: 'No students match.' })); return; }
  list.forEach(function (s) {
    var on = !!S.pick[s.name];
    var toggle = function () { if (s.dup) { toast('Two active students share this name - ask the office.'); return; } S.pick[s.name] = !S.pick[s.name]; drawStudents(); drawTests(); drawBar(); };
    add(el, h('div', { cls: 'item' },
      h('div', { cls: 'tick' + (on ? ' on' : ''), role: 'checkbox', 'aria-checked': on ? 'true' : 'false', tabindex: '0', onclick: toggle }, on ? '✓' : ''),
      h('div', { cls: 'main', onclick: toggle },
        h('div', { cls: 'nm', text: s.name }),
        h('div', { cls: 'sub', text: s.cls + (s.open.length ? ' · open: HW ' + s.open.sort(function (a, b) { return a - b; }).join(', ') : '') }),
        s.dup ? h('div', { cls: 'hint', text: 'Two active students have this name - cannot assign here.' }) : null),
      h('button', { cls: 'btn small', text: 'Homework', onclick: function () { showStudent(s.name); } })));
  });
}

function drawTests() {
  var el = $('tlist'); if (!el) return; clear(el);
  var q = S.tq.trim().toLowerCase(), sel = picked();
  var list = S.gd.tests.filter(function (t) { return !q || ('hw ' + t.num + ' homework ' + t.num + ' ' + t.topic).toLowerCase().indexOf(q) >= 0 || t.num === q; });
  if (!list.length) { add(el, h('div', { cls: 'item sub', text: 'No homework matches.' })); return; }
  list.forEach(function (t) {
    var on = !!S.tpick[t.num];
    var openFor = sel.filter(function (s) { return s.open.indexOf(t.num) >= 0; }).map(function (s) { return s.name; });
    var doneBy = sel.filter(function (s) { return s.done[t.num]; }).map(function (s) { return s.name + ' ' + s.done[t.num]; });
    var toggle = function () { S.tpick[t.num] = !S.tpick[t.num]; drawTests(); drawBar(); };
    add(el, h('div', { cls: 'item' },
      h('div', { cls: 'tick' + (on ? ' on' : ''), role: 'checkbox', 'aria-checked': on ? 'true' : 'false', tabindex: '0', onclick: toggle }, on ? '✓' : ''),
      h('div', { cls: 'main', onclick: toggle },
        h('div', { cls: 'nm', text: t.label }), h('div', { cls: 'sub', text: t.topic }),
        openFor.length ? h('div', { cls: 'hint', text: 'Already assigned (not done): ' + openFor.join(', ') }) : null,
        doneBy.length ? h('div', { cls: 'sub', text: 'Completed before: ' + doneBy.join(', ') }) : null),
      h('button', { cls: 'btn small', text: 'Solution', onclick: function () { showSolution(t.num); } })));
  });
}

function drawBar() {
  var host = clear($('barHost'));
  if (S.tab !== 'assign' || !S.gd) return;
  var ns = picked().length, nt = tpicked().length;
  add(host, h('div', { cls: 'bar' }, h('div', { cls: 'in' },
    h('div', { cls: 'sum', text: ns + ' student' + (ns === 1 ? '' : 's') + ' · ' + nt + ' homework' }),
    h('button', { cls: 'btn primary', text: 'Assign', disabled: !(ns && nt), onclick: confirmAssign }))));
}

function confirmAssign() {
  var st = picked(), ts = tpicked();
  var host = clear($('overHost'));
  var go = h('button', { cls: 'btn primary', text: 'Yes, assign' });
  var back = h('button', { cls: 'btn', text: 'Back', onclick: function () { clear(host); } });
  var box = h('div', { cls: 'sheet' },
    h('h3', { text: 'Assign homework?' }),
    h('div', { cls: 'sub', text: S.gd.label }),
    h('h2', { text: 'Students (' + st.length + ')' }), h('div', { text: st.map(function (s) { return s.name; }).join(', ') }),
    h('h2', { text: 'Homework (' + ts.length + ')' }), ts.map(function (t) { return h('div', { text: t.label + ' — ' + t.topic }); }),
    h('div', { cls: 'row', style: 'margin-top:18px' }, go, back));
  add(host, h('div', { cls: 'over' }, box));
  go.addEventListener('click', function () {
    go.disabled = true; back.disabled = true; go.textContent = 'Assigning…';
    call('apiAssign', S.session, S.grade, st.map(function (s) { return s.name; }), ts.map(function (t) { return t.num; })).then(function (r) {
      clear(box);
      if (!r.ok) { add(box, h('h3', { text: 'Not assigned' }), h('div', { cls: 'msg bad', text: r.msg }), h('button', { cls: 'btn', text: 'Close', onclick: function () { clear(host); if (r.grade) gradeProblem(r); } })); return; }
      add(box, h('h3', { text: r.assigned.length ? '✅ Assigned ' + r.assigned.length + ' homework' : 'Nothing new assigned' }));
      if (r.assigned.length) add(box, h('div', { cls: 'msg' }, r.assigned.map(function (a) { return h('div', { text: a.name + ' — Homework ' + a.num }); })));
      if (r.skipped.length) add(box, h('h2', { text: 'Skipped' }), h('div', { cls: 'msg bad' }, r.skipped.map(function (a) { return h('div', { text: a.name + (a.num ? ' — Homework ' + a.num : '') + ': ' + a.why }); })));
      add(box, h('button', { cls: 'btn primary', text: 'Done', onclick: function () { clear(host); S.pick = {}; S.tpick = {}; openGrade(S.grade); } }));
    });
  });
}

/* ---------- one student ---------- */
function showStudent(name) {
  var host = clear($('overHost'));
  var box = h('div', { cls: 'sheet' }, h('div', { cls: 'sub', text: 'Loading…' }));
  add(host, h('div', { cls: 'over' }, box));
  call('apiStudent', S.session, S.grade, name).then(function (r) {
    clear(box);
    var close = h('button', { cls: 'btn', text: 'Close', onclick: function () { clear(host); } });
    if (!r.ok) { add(box, h('div', { cls: 'msg bad', text: r.msg }), close); if (r.grade) gradeProblem(r); return; }
    add(box, h('div', { cls: 'row' }, h('div', { cls: 'grow' }, h('h3', { text: r.name }), h('div', { cls: 'sub', text: r.label + ' · ' + r.cls })), close));
    if (!r.rows.length) add(box, h('div', { cls: 'msg', text: 'No homework assigned yet.' }));
    r.rows.forEach(function (x) {
      var st = x.status.toLowerCase();
      var card = h('div', { cls: 'card' },
        h('div', { cls: 'row' }, h('div', { cls: 'grow' }, h('div', { cls: 'nm', text: x.label + (x.attempt ? ' · attempt ' + x.attempt : '') }), h('div', { cls: 'sub', text: x.topic })),
          h('span', { cls: 'pill' + (st === 'completed' ? ' ok' : st === 'cancelled' ? ' warn' : ''), text: x.status })),
        h('div', { cls: 'sub', text: 'Assigned ' + (x.assigned || '—') + (x.submitted ? ' · Submitted ' + x.submitted : '') }),
        st === 'completed' && x.score !== '' ? h('div', { style: 'margin-top:6px' }, h('b', { text: 'Score ' + x.score + ' / ' + x.max }), ' · Wrong: ' + (x.wrong === '' ? 'None' : x.wrong)) : null);
      var actions = h('div', { cls: 'row', style: 'margin-top:10px' });
      if (x.num) add(actions, h('button', { cls: 'btn small', text: 'Teacher Solution', onclick: function () { showSolution(x.num); } }));
      if (x.canCancel) {
        var cbtn = h('button', { cls: 'btn small danger', text: 'Cancel this homework' });
        cbtn.addEventListener('click', function () {
          if (cbtn.dataset.sure !== '1') { cbtn.dataset.sure = '1'; cbtn.textContent = 'Tap again to confirm cancel'; return; }
          cbtn.disabled = true; cbtn.textContent = 'Cancelling…';
          call('apiCancel', S.session, S.grade, r.name, x.ref).then(function (c) {
            if (!c.ok) { toast(c.msg); cbtn.disabled = false; cbtn.dataset.sure = ''; cbtn.textContent = 'Cancel this homework'; return; }
            toast('Cancelled.'); showStudent(name); refreshGradeQuiet();
          });
        });
        add(actions, cbtn);
      }
      add(card, actions); add(box, card);
    });
  });
}
function refreshGradeQuiet() {
  var g = S.grade;
  call('apiGrade', S.session, g).then(function (r) { if (r.ok && S.grade === g) { S.gd = r; if (S.tab === 'assign') { drawStudents(); drawTests(); drawBar(); } } });
}

/* ---------- Ask or Explain ---------- */
function loadReview() {
  var g = S.grade;
  call('apiReviewOptions', S.session, g).then(function (r) {
    if (S.grade !== g) return;
    if (!r.ok) { gradeProblem(r); return; }
    S.rv = { opt: r, cls: '', stu: '', num: '', data: null };
    if (S.tab === 'review') render();
  });
}
function renderReview(pane) {
  clear($('barHost'));
  if (!S.rv || S.rv.opt.grade !== S.grade) { add(pane, h('div', { cls: 'card center sub', text: 'Loading…' })); return; }
  var rv = S.rv, o = rv.opt;
  var studs = o.students.filter(function (s) { return !rv.cls || s.cls === rv.cls; });
  var nums = {}; o.pairs.forEach(function (p) { if ((!rv.cls || p.cls === rv.cls) && (!rv.stu || p.name.toLowerCase() === rv.stu.toLowerCase())) nums[p.num] = true; });
  var tests = o.tests.filter(function (t) { return nums[t.num]; });
  var cSel = h('select', { 'aria-label': 'Class', onchange: function () { rv.cls = this.value; rv.stu = ''; rv.data = null; render(); } },
    h('option', { value: '', text: 'All classes' }), o.classes.map(function (c) { return h('option', { value: c, text: c, selected: c === rv.cls }); }));
  var sSel = h('select', { 'aria-label': 'Student', onchange: function () { rv.stu = this.value; rv.data = null; render(); } },
    h('option', { value: '', text: 'All students' }), studs.map(function (s) { return h('option', { value: s.name, text: s.name, selected: s.name === rv.stu }); }));
  var tSel = h('select', { 'aria-label': 'Homework', onchange: function () { rv.num = this.value; rv.data = null; render(); if (rv.num) runReview(); } },
    h('option', { value: '', text: tests.length ? 'Choose the homework to review' : 'No homework assigned for this selection yet' }),
    tests.map(function (t) { return h('option', { value: t.num, text: t.label + ' — ' + t.topic, selected: t.num === rv.num }); }));
  if (rv.num && !nums[rv.num]) { rv.num = ''; rv.data = null; }
  add(pane, h('div', { cls: 'row' }, h('div', { cls: 'grow' }, cSel), h('div', { cls: 'grow' }, sSel)));
  add(pane, h('div', { style: 'margin-top:10px' }, tSel));
  var out = h('div', { id: 'rvout' }); add(pane, out);
  if (rv.num && rv.data) drawReview(out); else if (rv.num) add(out, h('div', { cls: 'card center sub', text: 'Loading…' }));
}
function runReview() {
  var rv = S.rv, key = [S.grade, rv.cls, rv.stu, rv.num].join('|');
  call('apiReview', S.session, S.grade, rv.cls, rv.stu, rv.num).then(function (r) {
    if ([S.grade, rv.cls, rv.stu, rv.num].join('|') !== key) return;
    if (!r.ok) { gradeProblem(r); return; }
    rv.data = r; if (S.tab === 'review') render();
  });
}
function drawReview(out) {
  var d = S.rv.data, v = d.review;
  add(out, h('div', { cls: 'card' },
    h('div', { cls: 'row' }, h('div', { cls: 'grow' }, h('div', { cls: 'nm', text: d.label }), h('div', { cls: 'sub', text: d.topic })),
      h('button', { cls: 'btn small', text: 'Teacher Solution', onclick: function () { showSolution(d.num); } }),
      h('button', { cls: 'btn small', text: 'Refresh', onclick: function () { S.rv.data = null; render(); runReview(); } })),
    h('div', { cls: 'ready', style: 'margin-top:10px', text: v.total ? 'Ready for class: ' + v.completed + ' of ' + v.total + ' completed' + (v.completed === v.total ? ' ✅ Everyone is done.' : '') : 'Nobody in this selection has been given that homework yet.' }),
    v.todo.length ? h('div', { cls: 'sub', text: 'Still to do: ' + v.todo.join(', ') }) : null));
  if (!v.total) return;
  var disc = !v.completed ? 'No completed submissions yet.' : !v.discuss.length ? 'No wrong answers so far among completed submissions.' :
    v.discuss.map(function (x) { return 'Q' + x.q + ' (' + x.n + ' wrong)'; }).join('   ');
  add(out, h('h2', { text: 'Discuss first' }), h('div', { cls: 'card', text: disc }));
  var head = h('tr', null, h('th', { cls: 'l', text: 'Student' }), h('th', { text: 'Status' }), h('th', { text: 'Score' }), h('th', { cls: 'l', text: 'Wrong' }));
  for (var i = 1; i <= 15; i++) add(head, h('th', { cls: 'q', text: 'Q' + i }));
  var cnt = h('tr', null, h('td', { cls: 'l sub', text: 'Wrong count' }), h('td'), h('td'), h('td'));
  v.wrongCount.forEach(function (n) { add(cnt, h('td', { cls: 'sub q', text: v.completed ? String(n) : '' })); });
  var body = v.rows.map(function (r) {
    var tr = h('tr', null, h('td', { cls: 'l', text: r.name }), h('td', { text: r.status }), h('td', { text: r.score }), h('td', { cls: 'l', text: r.wrong }));
    for (var q = 0; q < 15; q++) add(tr, h('td', { cls: 'q ' + (r.marks[q] === 'x' ? 'x' : r.marks[q] === 'ok' ? 'ok' : ''), text: r.marks[q] === 'x' ? '✗' : r.marks[q] === 'ok' ? '✓' : '' }));
    return tr;
  });
  add(out, h('h2', { text: 'Question by question' }), h('div', { cls: 'grid' }, h('table', null, h('thead', null, head), h('tbody', null, cnt, body))));
}

/* ---------- Teacher Solution viewer (pdf.js, renders pages as images) ---------- */
var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs() {
  if (window.__pdfReady) return window.__pdfReady;
  window.__pdfReady = new Promise(function (resolve, reject) {
    var s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
    s.integrity = 'sha512-q+4liFwdPC/bNdhUpZx6aXDx/h77yEQtn4I1slHydcbZK34nLaR3cAeYSJshoxIOq3mjEf7xJE8YWIUHMn+oCQ=='; s.crossOrigin = 'anonymous';
    s.onload = function () {
      var lib = window.pdfjsLib;
      fetch(PDFJS + 'pdf.worker.min.js', { integrity: 'sha512-BbrZ76UNZq5BhH7LL7pn9A4TKQpQeNCHOo65/akfelcIBbcVvYWOFQKPXIrykE3qZxYjmDX573oa4Ywsc7rpTw==', credentials: 'omit' })
        .then(function (r) { if (!r.ok) throw new Error('worker'); return r.text(); }).then(function (txt) {
        lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([txt], { type: 'text/javascript' }));
        resolve(lib);
      }).catch(function () { window.__pdfReady = null; reject(new Error('viewer')); });   // file not exactly as expected: do not run it
    };
    s.onerror = function () { window.__pdfReady = null; reject(new Error('viewer')); };
    document.head.appendChild(s);
  });
  return window.__pdfReady;
}
function showSolution(num) {
  var host = clear($('overHost'));
  var pages = h('div', { cls: 'pages' });
  var status = h('div', { cls: 'sub', text: 'Loading the Teacher Solution…' });
  var box = h('div', { cls: 'sheet' },
    h('div', { cls: 'row' }, h('div', { cls: 'grow' }, h('h3', { id: 'soltitle', text: 'Teacher Solution' }), status),
      h('button', { cls: 'btn', text: 'Close', onclick: function () {
        [].forEach.call(pages.querySelectorAll('img'), function (im) { try { URL.revokeObjectURL(im.src); } catch (e) {} });
        clear(host);
      } })), pages);
  add(host, h('div', { cls: 'over' }, box));
  Promise.all([call('apiSolution', S.session, S.grade, num), loadPdfJs().catch(function () { return null; })]).then(function (res) {
    var r = res[0], lib = res[1];
    if (!r.ok) { status.textContent = r.msg; status.className = 'msg bad'; if (r.grade) gradeProblem(r); return; }
    if (!lib) { status.textContent = 'The solution viewer could not load. Check the internet connection and try again.'; return; }
    $('soltitle').textContent = r.title;
    var raw = atob(r.data), bytes = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    lib.getDocument({ data: bytes, isEvalSupported: false }).promise.then(function (pdf) {
      status.textContent = pdf.numPages + ' pages';
      var dpr = Math.min(window.devicePixelRatio || 1, 2), width = Math.max(320, pages.clientWidth || 700);
      var n = 0;
      (function next() {
        n++; if (n > pdf.numPages || !document.body.contains(pages)) return;
        pdf.getPage(n).then(function (page) {
          var vp1 = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: width * dpr / vp1.width });
          var c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
          page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () {
            c.toBlob(function (b) {
              var img = h('img', { alt: 'Page ' + n }); img.src = URL.createObjectURL(b); add(pages, img);
              c.width = 0; c.height = 0; next();
            }, 'image/jpeg', 0.88);
          });
        });
      })();
    }).catch(function () { status.textContent = 'This Teacher Solution could not be displayed.'; });
  });
}

boot();
